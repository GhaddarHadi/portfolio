name: Supabase heartbeat

# Supabase's free tier pauses a project after 7 DAYS of no activity. A weekly
# cron that runs even a few hours late crosses that line, so this runs every
# 3 days — cheap insurance against a recruiter hitting a paused database.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            -X PATCH "${SUPABASE_URL}/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"pinged\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "HTTP $status"
          cat /tmp/out.txt
          if [ "$status" -ge 300 ]; then
            echo "Heartbeat failed — the Supabase project may pause." >&2
            exit 1
          fi
